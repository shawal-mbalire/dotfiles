[project]
name = "fabric"
version = "0.1.0"
description = "A Quickshell alternative in Python — a Wayland desktop shell built with Hexagonal Architecture and GTK4/gtk4-layer-shell."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# PyGObject is a system package on most distros (python3-gobject / python-gobject).
# It is not reliably installable from PyPI, so it is declared here only as a hint.
gtk = ["PyGObject>=3.50"]
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy"]
notify = ["dbus-next>=0.2.3"]  # optional: D-Bus notification daemon driver

[project.scripts]
fabric = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["domain", "infra", "adapters"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
