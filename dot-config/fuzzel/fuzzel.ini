[main]
namespace = fuzzel
output = eDP-1
font = Sono Medium:size=13, JetBrainsMono Nerd Font:size=13
prompt = "→ "
placeholder = "Search..."
icon-theme = BeautySolar
icons-enabled = yes
show-actions = yes
match-mode = fzf
terminal = kitty
use-bold = yes
layer = overlay
anchor = top-right
x-margin = 8
y-margin = 22
width = 40
lines = 12
tabs = 4
horizontal-pad = 16
vertical-pad = 10
inner-pad = 8
line-height = 16
letter-spacing = 0
sort-result = yes
match-counter = yes
dpi-aware = auto
enable-mouse = yes

[colors]
background = 1e1e2ecc
text = cdd6f4ff
message = a6adc8ff
prompt = 89b4faff
placeholder = 6c7086ff
input = cdd6f4ff
match = 89b4faff
selection = 313244ff
selection-text = cdd6f4ff
selection-match = 89b4faff
counter = 6c7086ff
border = 45475aff

[dmenu]
mode = text
exit-immediately-if-empty = yes

[key-bindings]
cancel = Control+g Control+c Escape
execute = Return KP_Enter
execute-or-next = Tab
execute-input = Shift+Return Shift+KP_Enter
clipboard-paste = Control+v
primary-paste = Shift+Insert
expunge = Shift+Delete