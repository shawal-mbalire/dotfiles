# Fixed digital gain for the internal laptop speakers.
#
# The hardware "Speaker Playback Volume" control on this ThinkPad
# (Conexant SN6140 + sof-hda-dsp) already reaches its 0 dB maximum at
# 100%, so any extra loudness has to come from software gain. This
# smart filter sits between applications and the internal Speaker sink,
# so 100% on the volume slider now includes the boost below.
#
# "Gain 1" is a linear amplitude: 1.0 = 0 dB, 1.41 = +3 dB, 2.0 = +6 dB.
# Raise it for more volume (watch for distortion/clipping), lower it if
# things sound harsh.

context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Speaker Loudness Boost"
            media.name       = "Speaker Loudness Boost"
            filter.graph = {
                nodes = [
                    {
                        type    = builtin
                        name    = boost
                        label   = mixer
                        control = { "Gain 1" = 2.0 }
                    }
                ]
                inputs  = [ "boost:In 1" ]
                outputs = [ "boost:Out" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name           = "speaker_boost"
                media.class         = "Audio/Sink"
                filter.smart        = true
                filter.smart.target = { node.name = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink" }
            }
            playback.props = {
                node.name    = "speaker_boost_output"
                node.passive = true
            }
        }
    }
]
